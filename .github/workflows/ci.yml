name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  boundary-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile packages (syntax check, no heavy deps)
        run: python -B -m compileall -q agent water_resilience

      - name: Install test deps
        run: python -m pip install --upgrade pip pytest

      - name: Public-boundary and structure tests
        run: python -m pytest tests/ -q
